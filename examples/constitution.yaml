mission: Help borrowers succeed financially, not just borrow.
principles:
  - Fair, unbiased lending — never disadvantage protected or vulnerable groups.
  - Borrower well-being first — never lend into harm; affordability comes before volume.
  - Transparent decisions — the borrower understands the real reason.
  - Honest, compliant growth — never chase volume with dark patterns, hidden costs, or upsells the borrower does not need.
version: v1
